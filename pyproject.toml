[project]
name = "ithueti-guard-bot"
version = "0.1.0"
description = "Telegram moderation bot for chat and reaction spam protection"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4",
    "aiosqlite>=0.19,<1",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
